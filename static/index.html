<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart CRM — La Nouvelle École</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header class="app-header">
    <div class="header-brand">
      <span class="brand-icon">🎓</span>
      <span class="brand-name">Smart CRM</span>
      <span class="brand-sub">La Nouvelle École</span>
    </div>
    <div class="header-controls">
      <label for="rep-select" class="sr-only">Commercial</label>
      <select id="rep-select" class="rep-select">
        <option value="">Chargement…</option>
      </select>
      <span id="today-badge" class="today-badge"></span>
    </div>
  </header>

  <!-- ===== TABS ===== -->
  <nav class="tab-nav" role="tablist">
    <button class="tab-btn active" data-tab="today" role="tab" aria-selected="true">📋 Aujourd'hui</button>
    <button class="tab-btn" data-tab="kanban" role="tab" aria-selected="false">📊 Pipeline</button>
    <button class="tab-btn" data-tab="team" role="tab" aria-selected="false">👥 Équipe</button>
  </nav>

  <!-- ===== MAIN ===== -->
  <main>

    <!-- TODAY VIEW -->
    <section id="tab-today" class="tab-panel active" role="tabpanel">
      <!-- Quick stats -->
      <div id="quick-stats" class="quick-stats"></div>

      <!-- Hero card -->
      <div id="hero-section" class="hero-section">
        <div id="hero-card" class="hero-card"></div>
      </div>

      <!-- Queue Explorer (Sidebar + Sub-tabs + Filterable Scrollable List) -->
      <div class="queue-workspace">
        <!-- Sidebar Navigation -->
        <aside class="queue-sidebar" aria-label="Catégories de la file de travail">
          <div class="sidebar-header">
            <span class="sidebar-title">📁 File de travail</span>
            <span class="sidebar-desc">Filtrer par urgence de rappel</span>
          </div>

          <div class="queue-nav-tabs" role="tablist">
            <button class="queue-nav-btn active" data-filter="overdue" role="tab" aria-selected="true">
              <span class="q-icon">🚨</span>
              <span class="q-label">En retard</span>
              <span class="q-badge badge-danger" id="badge-overdue">0</span>
            </button>

            <button class="queue-nav-btn" data-filter="today" role="tab" aria-selected="false">
              <span class="q-icon">⚡</span>
              <span class="q-label">Aujourd'hui</span>
              <span class="q-badge badge-warning" id="badge-today">0</span>
            </button>

            <button class="queue-nav-btn" data-filter="upcoming" role="tab" aria-selected="false">
              <span class="q-icon">📅</span>
              <span class="q-label">À venir</span>
              <span class="q-badge badge-info" id="badge-upcoming">0</span>
            </button>

            <button class="queue-nav-btn" data-filter="all" role="tab" aria-selected="false">
              <span class="q-icon">📋</span>
              <span class="q-label">Tous les leads</span>
              <span class="q-badge badge-neutral" id="badge-all">0</span>
            </button>
          </div>

          <div class="queue-search-wrapper">
            <label for="queue-search" class="sr-only">Filtrer les leads</label>
            <input type="text" id="queue-search" class="queue-search-input" placeholder="🔍 Filtrer par nom ou e-mail…" />
          </div>

          <div class="sidebar-footer-hint">
            💡 <span>Cliquez sur un prospect dans la liste pour charger ses détails directement dans la carte du haut.</span>
          </div>
        </aside>

        <!-- Main Panel: Selected Category List -->
        <div class="queue-main-panel">
          <div class="queue-panel-header">
            <div class="panel-header-left">
              <h3 id="queue-active-title" class="panel-title">🚨 En retard (Overdue)</h3>
              <p id="queue-active-desc" class="panel-desc">Prospects dont la date de relance est dépassée</p>
            </div>
            <div class="panel-header-right">
              <span id="queue-showing-count" class="showing-count">0 leads</span>
            </div>
          </div>

          <!-- Scrollable Leads Container (Prevents Infinite Page Scroll) -->
          <div id="queue-scroll-container" class="queue-scroll-container">
            <div id="queue-list" class="queue-list"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- KANBAN VIEW -->
    <section id="tab-kanban" class="tab-panel" role="tabpanel">
      <div class="kanban-filters">
        <input type="text" id="kanban-search" class="search-input" placeholder="🔍 Rechercher un lead…" />
        <select id="kanban-rep-filter" class="rep-select small">
          <option value="">Tous les commerciaux</option>
        </select>
      </div>
      <div id="kanban-board" class="kanban-board"></div>
    </section>

    <!-- TEAM VIEW -->
    <section id="tab-team" class="tab-panel" role="tabpanel">
      <div class="team-header">
        <h2>Vue équipe</h2>
        <p class="team-insight" id="team-insight"></p>
      </div>
      <div id="team-grid" class="team-grid"></div>
    </section>

  </main>

  <!-- ===== TOAST ===== -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- ===== MODAL: Log contact ===== -->
  <div id="log-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <h2 id="modal-title">Enregistrer un contact</h2>
      <div id="log-form-container"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn btn-ghost">Annuler</button>
        <button id="modal-submit" class="btn btn-primary">Enregistrer</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js" type="module"></script>
</body>
</html>
